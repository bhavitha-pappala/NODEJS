<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <nav>
        <img class="logo" src="../assets/images/white_logo 1.png">
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="login.html">Login</a>
            <a href="registration.html">Registration</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="cart.html">
                <img class="cart" src="../assets/images/cart.png">
            </a>
        </div>
    </nav>

    <section class="cart-section">
        <div class="cart-left">
            <a href="catalogue.html" class="continue">
                < Shopping continue
            </a>

            <h2>Shopping Cart</h2>

            <p>You have 3 items in your cart</p>

            <div class="cart-item">
                <img src="../assets/images/card1.jpeg">
                <div class="book-info">
                    <h3>Product-1</h3>
                </div>
                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
                <h3>₹681</h3>
                <i class="fa-solid fa-trash delete"></i>
            </div>

            <div class="cart-item">
                <img src="../assets/images/card2.jpg">
                <div class="book-info">
                    <h3>Product-2</h3>
                </div>
                
                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>

                <h3>₹681</h3>
                <i class="fa-solid fa-trash delete"></i>
            </div>
            <div class="cart-item">
                <img src="../assets/images/card3.jpg">
                <div class="book-info">
                    <h3>Product-3</h3>
                </div>
                <div class="quantity">
                    <button>-</button>
                    <span>1</span>
                    <button>+</button>
                </div>
                <h3>₹681</h3>
                <i class="fa-solid fa-trash delete"></i>
            </div>
                
        </div>

        <div class="payment-box">
            <h2 class="card-title">Card Details</h2>

            <h4 class="card-type">Card Type</h4>

            <div class="cards">
                <img src="../assets/images/Rectangle 9.png">
                <img src="../assets/images/Rectangle 10.png">
                <img src="../assets/images/Rectangle 11.png">
            </div>
            <label>Name on Card</label>
            <input type="text" placeholder="Name">
            <label>Card Number</label>
            <input type="text" placeholder="1111 2222 3333 4444">
            <div class="summary">
                <p>
                    Subtotal
                    <span>₹2043</span>
                </p>

                <p>
                    Shipping
                    <span>₹40</span>
                </p>

                <hr>

                <h3>
                    Total
                    <span>₹2083</span>
                </h3>
            </div>

            <button class="checkout">
                Checkout ->
            </button>
        </div>
    </section>
    <footer class="footer">
        <div class="social-icons">
            <a href="https://www.facebook.com/" target="_blank">
                <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="https://twitter.com/" target="_blank">
                <i class="fa-brands fa-twitter"></i>
            </a>

            <a href="https://www.instagram.com/" target="_blank">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
        <p>© 2026 E-store. All Rights Reserved .</p>
    </footer>
</body>
</html>
