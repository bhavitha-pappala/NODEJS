<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>{
        box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #f2f2f2; display: flex; flex-direction: column; min-height: 100vh;
    }
    .navbar {
      background-color: #1276a8; color: white; display: flex; justify-content: space-between; align-items: center; padding: 12px 30px;
    }
    .logo-container {
      display: fl.navbar {
      background-color: #1276a8; color: white; display: flex; justify-content: space-between; align-items: center; padding: 12px 30px;
    }

    .logo-container img {
      height: 40px; /* Replace with your logo path */
    }

    .nav-links {
      display: flex;list-style: none;
      gap: 25px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
    }

    .banner {
      background-color: #2bb037;
      color: white;
      text-align: center;
      padding: 14px;
      font-weight: bold;
      font-size: 18px;
    }

    .main-container {
      display: flex;
      gap: 20px;
      padding: 30px 40px;
      flex: 1;
    }

    .sidebar {
      width: 260px;
      background-color: #ffffff;
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #000;
    }

    .catalogue-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .catalogue-list li a {
      text-decoration: none;
      display: block;
      padding: 10px 15px;
      border-radius: 8px;
      color: #333;
      font-weight: 500;
    }

    /* Active State Style */
    .catalogue-list li.active a {
      background-color: #0e77a8;
      color: white;
    }

    /* Main Content Area */
    .content-box {
      flex: 1;
      background-color: #ffffff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .content-box h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #000;
    }

    .content-box p {
      font-size: 13px;
      line-height: 1.6;
      color: #333;
    }

    /* Footer */
    .footer {
      background-color: #000000;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      font-size: 13px;
    }

    .social-icons {
      display: flex;
      gap: 20px;
    }

    .social-icons a {
      color: white;
      font-size: 16px;
      text-decoration: none;
    }
    </style>
</head>
<body>
    
</body>
</html>
